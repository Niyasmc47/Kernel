server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: kernel-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME:niyas36et@gmail.com}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 7000
          timeout: 7000
          writetimeout: 7000

kernel:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
  admin:
    password: ${ADMIN_PASSWORD:kernelctygz}
  security:
    jwt-secret: ${JWT_SECRET:#{T(java.util.UUID).randomUUID().toString()}}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kernel47.vercel.app,https://*.vercel.app,http://localhost:3000}
  communication:
    session-ttl-minutes: ${COMMUNICATION_SESSION_TTL_MINUTES:60}
  conversation:
    session-ttl-minutes: ${CONVERSATION_SESSION_TTL_MINUTES:30}
  frontend:
    url: ${FRONTEND_URL:https://kernel47.vercel.app}
  backend:
    url: ${BACKEND_URL:https://kernel-backend-api-a8fmcze0ezfdg7au.centralindia-01.azurewebsites.net}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
